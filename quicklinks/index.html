<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saaim's Frames — Links</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="assets/saaimsframes/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/saaimsframes/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/saaimsframes/favicon-32x32.png">
  <link rel="apple-touch-icon" href="assets/saaimsframes/apple-touch-icon.png">
  <link rel="manifest" href="assets/saaimsframes/site.webmanifest">

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --black: #0f0f0f;
      --white: #fafaf8;
      --mid: #6b6b68;
      --light: #f5f4f0;
      --border: rgba(0, 0, 0, 0.09);
      --accent: #c8b89a;
    }

    html,
    body {
      min-height: 100vh;
      font-family: 'DM Sans', sans-serif;
      background: var(--light);
      color: var(--black);
      overflow-x: hidden;
    }

    /* ─── SUBTLE GRAIN TEXTURE ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 180px;
      opacity: 0.5;
    }

    /* ─── LAYOUT ─── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem 3rem;
    }

    /* ─── CARD ─── */
    .card {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ─── PROFILE ─── */
    .profile-photo-wrap {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .profile-photo {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      border: 3px solid var(--white);
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
      opacity: 0;
      animation: fadeUp 0.6s 0.1s forwards;
    }

    .profile-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      text-align: center;
      opacity: 0;
      animation: fadeUp 0.6s 0.25s forwards;
    }

    .profile-handle {
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--mid);
      margin-top: 0.3rem;
      text-align: center;
      opacity: 0;
      animation: fadeUp 0.6s 0.35s forwards;
    }

    .profile-bio {
      font-size: 0.84rem;
      color: var(--mid);
      line-height: 1.7;
      text-align: center;
      margin-top: 0.75rem;
      max-width: 30ch;
      opacity: 0;
      animation: fadeUp 0.6s 0.42s forwards;
    }

    /* ─── DIVIDER ─── */
    .divider {
      width: 32px;
      height: 1px;
      background: var(--accent);
      margin: 1.75rem auto;
      opacity: 0;
      animation: fadeUp 0.6s 0.48s forwards;
    }

    /* ─── LINKS ─── */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .link-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.25rem;
      background: var(--white);
      border: 0.5px solid var(--border);
      text-decoration: none;
      color: var(--black);
      transition: background 0.22s, border-color 0.22s, transform 0.18s;
      opacity: 0;
      animation: fadeUp 0.55s forwards;
      position: relative;
      overflow: hidden;
    }

    .link-item::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--black);
      transform: translateX(-101%);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 0;
    }

    .link-item:hover::after {
      transform: translateX(0);
    }

    .link-item:hover {
      border-color: var(--black);
      transform: translateY(-1px);
    }

    .link-item:hover .link-label,
    .link-item:hover .link-sub {
      color: var(--white);
    }

    .link-item:hover .link-icon-wrap {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.15);
    }

    .link-item:hover .link-arrow {
      color: var(--white);
    }

    .link-item:active {
      transform: translateY(0);
    }

    /* staggered delays */
    .link-item:nth-child(1) {
      animation-delay: 0.52s;
    }

    .link-item:nth-child(2) {
      animation-delay: 0.60s;
    }

    .link-item:nth-child(3) {
      animation-delay: 0.68s;
    }

    .link-item:nth-child(4) {
      animation-delay: 0.76s;
    }

    .link-item:nth-child(5) {
      animation-delay: 0.84s;
    }

    .link-icon-wrap {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border: 0.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.22s, border-color 0.22s;
      position: relative;
      z-index: 1;
    }

    .link-icon-wrap svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
      transition: color 0.22s;
    }

    .link-text {
      flex: 1;
      position: relative;
      z-index: 1;
    }

    .link-label {
      font-size: 0.88rem;
      font-weight: 500;
      display: block;
      transition: color 0.22s;
    }

    .link-sub {
      font-size: 0.7rem;
      color: var(--mid);
      letter-spacing: 0.04em;
      display: block;
      margin-top: 1px;
      transition: color 0.22s;
    }

    .link-arrow {
      font-size: 0.85rem;
      color: var(--mid);
      transition: color 0.22s, transform 0.22s;
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }

    .link-item:hover .link-arrow {
      transform: translateX(3px);
    }

    /* ─── FEATURED LINK (photography portfolio) ─── */
    .link-item.featured-link {
      background: var(--black);
      color: var(--white);
      border-color: var(--black);
    }

    .link-item.featured-link::after {
      background: #1e1e1c;
    }

    .link-item.featured-link .link-sub {
      color: rgba(255, 255, 255, 0.45);
    }

    .link-item.featured-link .link-arrow {
      color: rgba(255, 255, 255, 0.45);
    }

    .link-item.featured-link .link-icon-wrap {
      border-color: rgba(255, 255, 255, 0.15);
    }

    .link-item.featured-link:hover .link-label,
    .link-item.featured-link:hover .link-sub,
    .link-item.featured-link:hover .link-arrow {
      color: var(--white);
    }

    /* ─── FOOTER ─── */
    .page-footer {
      margin-top: 2.5rem;
      text-align: center;
      opacity: 0;
      animation: fadeUp 0.6s 1s forwards;
    }

    .page-footer img {
      height: 22px;
      width: auto;
      opacity: 0.35;
      display: block;
      margin: 0 auto 0.6rem;
    }

    .page-footer p {
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mid);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 480px) {
      .page {
        padding: 3rem 1.25rem 2.5rem;
      }

      .card {
        max-width: 100%;
      }
    }
  </style>
</head>
